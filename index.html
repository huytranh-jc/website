<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JoyCraft Games — AI-Augmented Game Studio</title>
<meta name="description" content="JoyCraft is a Vietnam-based, AI-augmented game studio building mobile titles — from rapid prototyping to polished launch.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/css/main.css">
<link rel="stylesheet" href="assets/css/home.css">

<!-- no-FOUC theme init: apply saved/system theme before first paint -->
<script>
(function () {
  var KEY = 'joycraft-theme', saved = localStorage.getItem(KEY);
  var theme = (saved === 'dark' || saved === 'light')
    ? saved
    : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<!-- chrome + content are rendered from data.js by the scripts below -->
<div id="nav-root"></div>
<main id="main"></main>
<div id="footer-root"></div>

<!-- order matters: data → shared components → page renderer → behavior -->
<script src="assets/js/data.js"></script>
<script src="assets/js/components.js"></script>
<script src="assets/js/home.js"></script>
<script src="assets/js/theme.js"></script>
</body>
</html>
